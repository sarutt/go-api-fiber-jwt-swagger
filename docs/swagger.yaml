basePath: /
definitions:
  main.ApprovalLog:
    properties:
      created_at:
        type: string
      decision:
        type: string
      episode_id:
        type: integer
      from_status:
        $ref: '#/definitions/main.EpisodeStatus'
      gate:
        type: string
      id:
        type: integer
      notes:
        type: string
      reviewer:
        type: string
      to_status:
        $ref: '#/definitions/main.EpisodeStatus'
    type: object
  main.ApprovalRequest:
    properties:
      decision:
        type: string
      gate:
        type: string
      notes:
        type: string
    type: object
  main.Asset:
    properties:
      created_at:
        type: string
      duration_seconds:
        type: integer
      episode_id:
        type: integer
      generated_by:
        type: string
      id:
        type: integer
      kind:
        $ref: '#/definitions/main.AssetKind'
      platform:
        type: string
      uri:
        type: string
    type: object
  main.AssetKind:
    enum:
    - SCRIPT
    - VOICEOVER
    - MUSIC
    - ANIMATION
    - MASTER_VIDEO
    - SHORTS_CUT
    - TIKTOK_CUT
    - THUMBNAIL
    type: string
    x-enum-varnames:
    - AssetScript
    - AssetVoiceOver
    - AssetMusic
    - AssetAnimation
    - AssetMasterVideo
    - AssetShortsCut
    - AssetTikTokCut
    - AssetThumbnail
  main.Book:
    properties:
      author:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  main.Character:
    properties:
      active:
        type: boolean
      color_hex:
        type: string
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      reference_sheet_url:
        type: string
      role:
        type: string
      signature_item:
        type: string
      species:
        type: string
      teaches:
        type: string
      updated_at:
        type: string
      voice_profile_id:
        type: string
    type: object
  main.CurriculumTopic:
    properties:
      created_at:
        type: string
      difficulty_level:
        type: integer
      id:
        type: integer
      learning_goal:
        type: string
      theme:
        type: string
      title:
        type: string
      updated_at:
        type: string
      used:
        type: boolean
      week_in_cycle:
        type: integer
    type: object
  main.Episode:
    properties:
      ai_disclosure:
        type: boolean
      code:
        type: string
      created_at:
        type: string
      curriculum_topic_id:
        type: integer
      duration_seconds:
        type: integer
      id:
        type: integer
      made_for_kids:
        description: |-
          MadeForKids drives the YouTube selfDeclaredMadeForKids flag. It defaults
          to true because every episode of this show is children's content, and
          getting this wrong is a COPPA problem rather than a cosmetic one.
        type: boolean
      published_at:
        type: string
      scheduled_at:
        type: string
      script_text:
        type: string
      song_lyrics:
        type: string
      song_title:
        type: string
      status:
        $ref: '#/definitions/main.EpisodeStatus'
      synopsis:
        type: string
      tiktok_video_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      youtube_video_id:
        type: string
    type: object
  main.EpisodeEvent:
    properties:
      actor:
        type: string
      created_at:
        type: string
      episode_id:
        type: integer
      from_status:
        $ref: '#/definitions/main.EpisodeStatus'
      id:
        type: integer
      note:
        type: string
      to_status:
        $ref: '#/definitions/main.EpisodeStatus'
    type: object
  main.EpisodeStatus:
    enum:
    - IDEA_BACKLOG
    - SCRIPT_DRAFT
    - SCRIPT_APPROVED
    - VO_GENERATED
    - MUSIC_GENERATED
    - ANIMATION_RENDERED
    - ASSEMBLED
    - QA_REVIEW
    - PLATFORM_ADAPTED
    - SCHEDULED
    - PUBLISHED
    - ANALYZED
    - CANCELLED
    type: string
    x-enum-varnames:
    - StatusIdeaBacklog
    - StatusScriptDraft
    - StatusScriptApproved
    - StatusVOGenerated
    - StatusMusicGenerated
    - StatusAnimationRendered
    - StatusAssembled
    - StatusQAReview
    - StatusPlatformAdapted
    - StatusScheduled
    - StatusPublished
    - StatusAnalyzed
    - StatusCancelled
  main.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  main.Location:
    properties:
      background_asset_url:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
      used_for:
        type: string
    type: object
  main.StageInfo:
    properties:
      layer:
        type: string
      next_statuses:
        items:
          $ref: '#/definitions/main.EpisodeStatus'
        type: array
      owner_agent:
        type: string
      requires_gate:
        type: string
      status:
        $ref: '#/definitions/main.EpisodeStatus'
    type: object
  main.TransitionRequest:
    properties:
      actor:
        type: string
      note:
        type: string
      to_status:
        $ref: '#/definitions/main.EpisodeStatus'
    type: object
host: localhost:8080
info:
  contact: {}
  description: Orchestration backend for the automated short-form video pipeline,
    plus the original book sample endpoints.
  title: Pom Pom Hollow Production API
  version: "1.0"
paths:
  /books:
    get:
      consumes:
      - application/json
      description: Get details of all books
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Book'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Get all books
      tags:
      - books
  /pipeline/assets/{id}:
    delete:
      parameters:
      - description: Asset ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete an asset
      tags:
      - pipeline-assets
  /pipeline/characters:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Character'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List the cast
      tags:
      - showbible
    post:
      consumes:
      - application/json
      parameters:
      - description: Character
        in: body
        name: character
        required: true
        schema:
          $ref: '#/definitions/main.Character'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.Character'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Add a character to the cast
      tags:
      - showbible
  /pipeline/characters/{id}:
    get:
      parameters:
      - description: Character ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Character'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get one character
      tags:
      - showbible
    put:
      consumes:
      - application/json
      parameters:
      - description: Character ID
        in: path
        name: id
        required: true
        type: integer
      - description: Character fields to update
        in: body
        name: character
        required: true
        schema:
          $ref: '#/definitions/main.Character'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Character'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update a character
      tags:
      - showbible
  /pipeline/curriculum-topics:
    get:
      parameters:
      - description: Filter by theme
        enum:
        - COUNTING
        - LETTERS
        - EMOTIONS
        - KINDNESS
        in: query
        name: theme
        type: string
      - description: Filter by whether a topic has been used
        in: query
        name: used
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.CurriculumTopic'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List curriculum topics
      tags:
      - showbible
    post:
      consumes:
      - application/json
      parameters:
      - description: Curriculum topic
        in: body
        name: topic
        required: true
        schema:
          $ref: '#/definitions/main.CurriculumTopic'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.CurriculumTopic'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Add a curriculum topic to the backlog
      tags:
      - showbible
  /pipeline/curriculum-topics/{id}/used:
    post:
      description: Called once an episode has been created from the topic, so the
        rotation moves on.
      parameters:
      - description: Curriculum topic ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CurriculumTopic'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Mark a curriculum topic as used
      tags:
      - showbible
  /pipeline/curriculum-topics/next:
    get:
      description: What the content idea agent calls to find the next teaching subject
        due in the rotation. Returns the lowest difficulty unused topic, following
        the four week cycle order.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CurriculumTopic'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get the next unused curriculum topic
      tags:
      - showbible
  /pipeline/episodes:
    get:
      consumes:
      - application/json
      description: List every episode, newest first. Filter by pipeline stage with
        ?status=
      parameters:
      - description: Filter by pipeline status
        enum:
        - IDEA_BACKLOG
        - SCRIPT_DRAFT
        - SCRIPT_APPROVED
        - VO_GENERATED
        - MUSIC_GENERATED
        - ANIMATION_RENDERED
        - ASSEMBLED
        - QA_REVIEW
        - PLATFORM_ADAPTED
        - SCHEDULED
        - PUBLISHED
        - ANALYZED
        - CANCELLED
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Episode'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List episodes
      tags:
      - pipeline-episodes
    post:
      consumes:
      - application/json
      description: Creates an episode in IDEA_BACKLOG. Status from the request body
        is ignored — every episode enters the pipeline at the first stage.
      parameters:
      - description: Episode
        in: body
        name: episode
        required: true
        schema:
          $ref: '#/definitions/main.Episode'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.Episode'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create an episode
      tags:
      - pipeline-episodes
  /pipeline/episodes/{id}:
    delete:
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete an episode
      tags:
      - pipeline-episodes
    get:
      consumes:
      - application/json
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Episode'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get one episode
      tags:
      - pipeline-episodes
    put:
      consumes:
      - application/json
      description: Updates the editorial fields of an episode. Status is not editable
        here — use the transition endpoint.
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      - description: Episode fields to update
        in: body
        name: episode
        required: true
        schema:
          $ref: '#/definitions/main.Episode'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Episode'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update episode content
      tags:
      - pipeline-episodes
  /pipeline/episodes/{id}/approvals:
    get:
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.ApprovalLog'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List the gate decisions for an episode
      tags:
      - pipeline-approvals
    post:
      consumes:
      - application/json
      description: The only way past the two mandatory review gates, and restricted
        to the reviewer role so an agent cannot approve its own work. GATE_1_SCRIPT
        releases an approved script into production; GATE_2_RELEASE clears an assembled
        episode for publishing. The decision is attributed to the authenticated caller,
        and a rejection sends the episode back for rework.
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      - description: Gate decision
        in: body
        name: approval
        required: true
        schema:
          $ref: '#/definitions/main.ApprovalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.ApprovalLog'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Record a human decision at a gate
      tags:
      - pipeline-approvals
  /pipeline/episodes/{id}/assets:
    get:
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      - description: Filter by asset kind
        enum:
        - SCRIPT
        - VOICEOVER
        - MUSIC
        - ANIMATION
        - MASTER_VIDEO
        - SHORTS_CUT
        - TIKTOK_CUT
        - THUMBNAIL
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Asset'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List the files produced for an episode
      tags:
      - pipeline-assets
    post:
      consumes:
      - application/json
      description: How a generation agent reports its output. The episode ID comes
        from the path, so an agent cannot file an asset against a different episode.
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      - description: Asset
        in: body
        name: asset
        required: true
        schema:
          $ref: '#/definitions/main.Asset'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.Asset'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Register a produced file against an episode
      tags:
      - pipeline-assets
  /pipeline/episodes/{id}/events:
    get:
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.EpisodeEvent'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Get the stage history of an episode
      tags:
      - pipeline-episodes
  /pipeline/episodes/{id}/transition:
    post:
      consumes:
      - application/json
      description: Used by production agents. Refuses any move the state machine does
        not allow, and refuses the two gate transitions, which require a human approval
        instead.
      parameters:
      - description: Episode ID
        in: path
        name: id
        required: true
        type: integer
      - description: Target stage
        in: body
        name: transition
        required: true
        schema:
          $ref: '#/definitions/main.TransitionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Episode'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Move an episode to the next stage
      tags:
      - pipeline-episodes
  /pipeline/locations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Location'
            type: array
      security:
      - ApiKeyAuth: []
      summary: List the recurring sets
      tags:
      - showbible
    post:
      consumes:
      - application/json
      parameters:
      - description: Location
        in: body
        name: location
        required: true
        schema:
          $ref: '#/definitions/main.Location'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.Location'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Add a set
      tags:
      - showbible
  /pipeline/queue:
    get:
      description: How a production agent finds its next job. Returns every episode
        currently waiting at the given stage, oldest first.
      parameters:
      - description: Pipeline stage to poll
        in: query
        name: status
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Episode'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get the work queue for a stage
      tags:
      - pipeline
  /pipeline/reviews/pending:
    get:
      description: 'Powers the reviewer dashboard: every episode currently parked
        at a gate. Filter to one gate with ?gate=GATE_1_SCRIPT'
      parameters:
      - description: Limit to one gate
        enum:
        - GATE_1_SCRIPT
        - GATE_2_RELEASE
        in: query
        name: gate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Episode'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List everything waiting on a human
      tags:
      - pipeline-approvals
  /pipeline/stages:
    get:
      description: Returns every stage with its owning agent, allowed next stages
        and any human gate. Lets an agent discover where it fits without hardcoding
        the flow.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.StageInfo'
            type: array
      security:
      - ApiKeyAuth: []
      summary: Describe the pipeline
      tags:
      - pipeline
schemes:
- http
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
